name: Daily regulator sync

# WHY GITHUB ACTIONS (and not Vercel Cron):
# This repo has no vercel.json, no .vercel directory, and no deployment of any
# kind -- it currently only runs via a local dev server. Vercel Cron requires a
# Vercel deployment to attach to, so it is not available. GitHub Actions is
# portable, does not depend on where this eventually gets hosted, and the
# sibling regtracker project already schedules its ingestion exactly this way.
#
# STATUS: live. The cron below runs daily from the default branch.
#
# Its first scheduled runs (from 7 September 2026) failed installing Python
# dependencies: requirements.txt carries sentence-transformers, which drags in
# torch and the full NVIDIA CUDA wheel set and exhausts the runner's disk
# ("[Errno 28] No space left on device", run 35073407515). Nothing registered
# in lib/sync.ts needs it -- only the unregistered cerc_scraper.py and
# aptel_watcher.py do -- so this job installs scrapers/requirements-sync.txt,
# the slim set the sync actually needs. See that file for the reasoning.
#
# REQUIRED REPOSITORY SECRETS (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL      Postgres connection string for the wiki database
#   DEEPSEEK_API_KEY  DeepSeek key used to classify new documents
# Without them the job cannot reach Postgres or classify anything. Optional
# repository VARIABLE: SYNC_RUNNER (see the runs-on comment below).

on:
  schedule:
    # 03:00 UTC daily (about 08:30 IST), matching the regtracker convention.
    # GitHub queues scheduled runs on shared runners, so the real start time
    # can drift by several minutes. That is fine for a daily digest feed.
    - cron: "0 3 * * *"
  workflow_dispatch: {} # manual "Run workflow" button

# Two syncs writing the same documents concurrently would race on the dedup
# check, so let an in-flight run finish rather than starting a second.
concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    # GitHub-hosted runners sit on US datacenter IPs, and several Indian
    # government sites refuse or silently empty those: EPFO has answered
    # every scheduled run with HTTP 403 since at least 2026-09-19, and
    # ESIC and MTCTE returned nothing, while all three scrape fully from an
    # Indian connection (verified 2026-09-24). Set the repository variable
    # SYNC_RUNNER to a self-hosted runner's label (one on an Indian IP) to
    # move the job there; unset, it stays on ubuntu-latest. A self-hosted
    # runner needs passwordless sudo for the apt-get steps below, or those
    # packages preinstalled.
    runs-on: ${{ vars.SYNC_RUNNER || 'ubuntu-latest' }}
    # 12 regulators now (was 3 when this comment was first written; FIU-IND
    # added 2026-08-25, MERC 2026-09-14), each new document costing a DeepSeek
    # call. MERC is in REGULATORS but is deliberately EXCLUDED from scheduled
    # runs by its own skipScheduled flag, which lib/sync.ts honours when the
    # trigger is "schedule". Its first sync is a ~20,600-document backfill
    # rather than a daily delta, and it would exhaust the budget below every
    # night while spending real DeepSeek credit to do it. Run it by hand once
    # (npx tsx scripts/sync-all.ts --only MERC), then drop the flag. CCI and
    # DOS-ISRO were both already present in lib/sync.ts's REGULATORS array
    # (which this job's `sync-all.ts --trigger schedule` call below already
    # runs in full, no --only filter) before this comment was last revised --
    # nothing needed adding here for either. What actually blocked treating
    # CCI as safe to let this cron run was a real bug, not missing wiring:
    # cci_scraper/pipeline.py re-downloaded, re-OCR'd, and re-classified its
    # WHOLE ~1,317-document corpus on every single run with no check for what
    # was already known, confirmed live 2026-08-25 to take ~48.5 minutes and
    # exceed lib/sync.ts's scrape timeout every time. Fixed via an
    # incremental skip (cci_scraper/pipeline.py's filter_changed_items(), a
    # cheap HEAD-request ETag/Last-Modified check against cci.gov.in's own
    # file server) -- a real re-run of the full tracked sync-all.ts path
    # after the fix, with Postgres already caught up, completed in ~116
    # seconds with 0 new documents (nothing had changed), confirming CCI is
    # no longer the reason this job needs a large timeout budget. 120 minutes
    # is kept as real headroom for the other regulators (DoT's own real
    # per-topic-page crawl, primarily) and for a day CCI genuinely has a
    # large batch of new documents, not because a routine CCI run is
    # expected to need anywhere near it. The default 360-minute cap is still
    # the outer bound if this proves short.
    #
    # Raised to 150 on 2026-09-24: DoT alone now has a 90-minute scrape
    # timeout (its measured clean-state run is ~66 minutes, see its entry in
    # lib/sync.ts), and a full manual run of the other ten regulators took
    # 16 minutes the same day, plus ~10 minutes of setup above.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      # requirements-sync.txt, NOT requirements.txt -- the latter installs
      # torch + CUDA and fills the runner disk. See the header comment.
      - name: Install Python dependencies
        working-directory: scrapers
        run: pip install -r requirements-sync.txt

      # CCI (cci_scraper/) is a standalone package with its own dependency
      # set (aiohttp, pypdf, pytesseract, pdf2image, ...) -- not covered by
      # scrapers/requirements.txt, which predates it and lists only the
      # other 9 regulators' shared deps.
      - name: Install CCI-specific Python dependencies
        working-directory: scrapers/cci_scraper
        run: pip install -r requirements.txt

      # fiu_scraper (fiu_scraper/) is likewise a standalone package with its
      # own dependency set (aiohttp, pypdf, pytesseract, pdf2image, openpyxl
      # for loading the taxonomy workbook directly, ...) -- not covered by
      # scrapers/requirements.txt, same situation as CCI's own step above.
      - name: Install FIU-specific Python dependencies
        working-directory: scrapers/fiu_scraper
        run: pip install -r requirements.txt

      # dot_watcher.py and mtcte_watcher.py drive real Chromium via Playwright.
      # mib_updates_scrapper.py uses plain requests and does not need this.
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # CCI's OCR fallback (cci_scraper/extractor.py, for pre-2015 scanned
      # antitrust orders -- confirmed ~28% of that corpus needs it) needs
      # both real system binaries, not just their Python bindings. Found
      # missing during real testing (2026-08-21): pytesseract/pdf2image
      # imported fine but OCR still failed with "Is poppler installed and in
      # PATH?" because only the Python wrapper packages were ever installed,
      # never the underlying poppler-utils/tesseract-ocr binaries. FIU-IND's
      # own OCR fallback (fiu_scraper/extractor.py, ported unchanged from
      # cci_scraper's -- confirmed live 2026-08-25 that pre-2015 Compliance
      # Orders are scanned images too) needs the exact same binaries, so this
      # one step covers both packages; the local dev sandbox that built
      # fiu_scraper did NOT have these installed, so its real test-sample run
      # (taxonomy-findings.md) has genuine extraction gaps this step avoids
      # in CI.
      - name: Install poppler and tesseract (CCI + FIU OCR fallback)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        # Exits non-zero only if EVERY regulator errored. A regulator being
        # blocked is a recorded outcome, not a job failure -- see scripts/sync-all.ts.
        #
        # xvfb-run: dot_watcher.py launches Chromium HEADED (headless=False,
        # parked off-screen), which is how it was validated against
        # dot.gov.in. A runner has no display, so every scheduled DOT run
        # from 2026-09-16 on died at browser launch ("Scraper exited 1" with
        # only Playwright's "<gracefully close end>" in the log). xvfb-run
        # gives it a virtual one; `playwright install --with-deps` above
        # already installs xvfb. Headless scrapers are unaffected.
        run: xvfb-run -a npx tsx scripts/sync-all.ts --trigger schedule

      - name: Show recent sync history
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/show-sync-runs.ts 3

      # Scraped CSVs are gitignored, so there is nothing to commit back. The
      # durable record of each run lives in the SyncRun/SyncRunRegulator tables
      # in Postgres, which is also what a future digest will read.
